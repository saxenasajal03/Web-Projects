<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To-Do List - InternDesire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0f14; --card:#111827; --text:#e5e7eb; --muted:#9ca3af;
      --accent:#22d3ee; --accent-2:#38bdf8; --ring:0 0 0 .2rem rgba(34,211,238,.35);
    }
    [data-theme="light"]{
      --bg:#f4f6f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
      --accent:#0ea5e9; --accent-2:#06b6d4; --ring:0 0 0 .25rem rgba(14,165,233,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font:16px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto;
      background:linear-gradient(180deg,var(--bg),#111 60%); color:var(--text);
      display:grid; place-items:center; padding:24px;
    }
    .app{
      width:min(680px,100%); background:var(--card); border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.3); padding:24px; border:1px solid rgba(255,255,255,.06)
    }
    header{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px}
    h1{font-size:28px; margin:0; letter-spacing:.3px}
    .theme-btn{
      background:transparent; border:1px solid rgba(255,255,255,.12); color:var(--text);
      padding:8px 12px; border-radius:12px; cursor:pointer;
    }
    form.add{display:flex; gap:10px; margin:12px 0 18px}
    .add input{
      flex:1; padding:14px 16px; border-radius:14px; border:1px solid rgba(255,255,255,.12);
      background:#00000022; color:var(--text); outline:none;
    }
    .add input:focus{box-shadow:var(--ring)}
    .add button{
      padding:14px 16px; border-radius:14px; border:none; cursor:pointer; color:#00111a;
      background:linear-gradient(135deg,var(--accent),var(--accent-2)); font-weight:700;
    }
    .meta{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0 12px}
    .filters{display:flex; gap:8px; flex-wrap:wrap}
    .filters input{display:none}
    .filters label{
      padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.12); cursor:pointer; color:var(--muted)
    }
    .filters input:checked + label{
      color:var(--text); border-color:var(--accent-2); box-shadow:var(--ring)
    }
    ul#list{list-style:none; padding:0; margin:0; display:grid; gap:10px}
    .item{
      display:grid; grid-template-columns:auto 1fr auto; gap:12px;
      align-items:center; padding:12px; background:#0000001a; border:1px solid rgba(255,255,255,.08);
      border-radius:14px
    }
    .item.completed .title{color:var(--muted); text-decoration:line-through}
    .title{overflow-wrap:anywhere}
    .controls{display:flex; gap:8px}
    .icon-btn{
      background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,.12);
      padding:8px 10px; border-radius:10px; cursor:pointer
    }
    .icon-btn:hover{color:var(--text); border-color:var(--accent-2)}
    .muted{color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <main class="app" aria-labelledby="title">
    <header>
      <h1 id="title">To-Do List</h1>
      <button class="theme-btn" id="toggleTheme" aria-pressed="false" title="Toggle theme">🌗 Theme</button>
    </header>

    <form class="add" id="addForm" autocomplete="off" aria-label="Add a new task">
      <input id="todoInput" type="text" placeholder="What needs to be done?" required minlength="1" />
      <button type="submit">Add</button>
    </form>

    <div class="meta">
      <p id="counter" class="muted">0 items</p>
      <fieldset class="filters" role="radiogroup" aria-label="Filter tasks">
        <input type="radio" name="filter" id="f-all" value="all" checked><label for="f-all">All</label>
        <input type="radio" name="filter" id="f-active" value="active"><label for="f-active">Active</label>
        <input type="radio" name="filter" id="f-completed" value="completed"><label for="f-completed">Completed</label>
      </fieldset>
    </div>

    <ul id="list" role="list" aria-live="polite" aria-relevant="all"></ul>

    <div class="meta" style="margin-top:16px">
      <button id="clearCompleted" class="icon-btn">🧹 Clear Completed</button>
      <span class="muted">Data stored locally</span>
    </div>
  </main>

  <script>
    const $ = sel => document.querySelector(sel);
    const listEl = $('#list');
    const inputEl = $('#todoInput');
    const formEl = $('#addForm');
    const counterEl = $('#counter');
    const clearBtn = $('#clearCompleted');
    const themeBtn = $('#toggleTheme');
    const filterRadios = document.querySelectorAll('.filters input[name="filter"]');

    let tasks = JSON.parse(localStorage.getItem('tasks.v1') || '[]');
    let filter = /** @type {'all'|'active'|'completed'} */ ('all');

   const uid = () => Math.random().toString(36).slice(2, 9);
    const save = () => localStorage.setItem('tasks.v1', JSON.stringify(tasks));
    const setTheme = next => {
      document.documentElement.setAttribute('data-theme', next);
      themeBtn.setAttribute('aria-pressed', String(next === 'dark'));
      localStorage.setItem('theme', next);
    };

    // ====== Render ======
    function render(){
      // filter tasks
      const visible = tasks.filter(t =>
        filter === 'active' ? !t.completed :
        filter === 'completed' ? t.completed : true
      );

      // build list
      listEl.innerHTML = visible.map(t => `
        <li class="item ${t.completed ? 'completed':''}" data-id="${t.id}">
          <input id="cb-${t.id}" class="sr-only" type="checkbox" ${t.completed?'checked':''} />
          <button class="icon-btn toggle" aria-pressed="${t.completed}" aria-labelledby="lab-${t.id}">✅</button>
          <label id="lab-${t.id}" class="title" for="cb-${t.id}">${t.text}</label>
          <div class="controls">
            <button class="icon-btn edit" title="Edit">✏️</button>
            <button class="icon-btn remove" title="Delete">🗑️</button>
          </div>
        </li>
      `).join('');

      // counter
      const remaining = tasks.filter(t => !t.completed).length;
      counterEl.textContent = `${remaining} item${remaining!==1?'s':''} left`;
      save();
    }

    // ====== Actions ======
    formEl.addEventListener('submit', e => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if(!text) return;
      tasks.unshift({ id: uid(), text, completed:false, createdAt: Date.now() });
      inputEl.value = '';
      render();
    });

    // Event delegation for list buttons
    listEl.addEventListener('click', e => {
      const li = e.target.closest('.item');
      if(!li) return;
      const id = li.dataset.id;
      const i = tasks.findIndex(t => t.id === id);
      if(i < 0) return;

      if(e.target.closest('.toggle')){
        tasks[i].completed = !tasks[i].completed;
        render();
      }
      if(e.target.closest('.remove')){
        tasks.splice(i,1);
        render();
      }
      if(e.target.closest('.edit')){
        const next = prompt('Edit task', tasks[i].text);
        if(next !== null){
          const trimmed = next.trim();
          if(trimmed) tasks[i].text = trimmed;
          render();
        }
      }
    });

    clearBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.completed);
      render();
    });

    filterRadios.forEach(r => r.addEventListener('change', e => {
      // @ts-ignore
      filter = e.target.value;
      render();
    }));

    // Theme toggle
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'light' ? 'dark' : 'light');
    });

    // ====== Init ======
    setTheme(localStorage.getItem('theme') || 'light');
    render();
  </script>
</body>
</html>
